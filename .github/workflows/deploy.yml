name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test -- --watch=false --browsers=ChromeHeadless

      - run: npm run build

      # Stamp the built output with the commit that produced it, so the CMS
      # deploy widget can tell exactly when the new version is live on the edge.
      - name: Write version.json
        run: |
          printf '{"sha":"%s","runId":"%s","runNumber":"%s","builtAt":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > dist/browser/version.json

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
